<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErgoList - Inspeção Ergonômica</title>
    <meta name="description" content="Ferramenta de auxílio à inspeção ergonômica baseada nos critérios de Scapin e Bastien.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>ErgoList</h1>
            <p>Inspeção Ergonômica de Interfaces</p>
        </div>
    </header>

    <main class="container">
        <!-- Setup Screen -->
        <section id="setup-screen" class="card active">
            <h2>Configuração da Inspeção</h2>
            <div class="form-group">
                <label for="app-name">Nome da Aplicação</label>
                <input type="text" id="app-name" placeholder="Ex: Sistema Acadêmico" required>
            </div>
            <div class="form-group">
                <label for="app-type">Tipo de Aplicação</label>
                <select id="app-type">
                    <option value="Web">Web</option>
                    <option value="Desktop">Desktop</option>
                    <option value="Mobile">Mobile</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <button id="start-btn" class="btn btn-primary">Iniciar Inspeção</button>
        </section>

        <!-- Inspection Screen -->
        <section id="inspection-screen" class="card">
            <div class="inspection-header">
                <div class="info">
                    <h2 id="current-app-display">Aplicação: <span></span></h2>
                    <p id="progress-text">Progresso: 0% (0 / 0 respondidas)</p>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <div id="questions-container">
                <!-- Questions will be injected here by JS -->
            </div>

            <div class="inspection-footer">
                <button id="finish-btn" class="btn btn-success" disabled>Finalizar e Ver Resultados</button>
            </div>
        </section>

        <!-- Results Screen -->
        <section id="results-screen" class="card">
            <div class="results-header">
                <h2>Resultados da Avaliação</h2>
                <div class="app-info-panel">
                    <p><strong>Aplicação:</strong> <span id="result-app-name"></span></p>
                    <p><strong>Tipo:</strong> <span id="result-app-type"></span></p>
                </div>
                <div id="stats-container" class="stats-grid">
                    <!-- Stats cards will be injected here -->
                </div>
            </div>

            <div class="table-responsive">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Critério</th>
                            <th>Subcritério</th>
                            <th>Questão</th>
                            <th>Resposta</th>
                            <th>Recomendação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results will be injected here -->
                    </tbody>
                </table>
            </div>

            <div class="results-actions">
                <button id="new-inspection-btn" class="btn btn-secondary">Nova Inspeção</button>
                <button id="print-btn" class="btn btn-primary">Imprimir / Salvar PDF</button>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 ErgoList - Design baseado nos Critérios Ergonômicos de Scapin & Bastien</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
